name: publish-plugin
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run build && npm run package:windy
      - name: Publish to Windy
        env:
          WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
        run: |
          test -n "$WINDY_API_KEY"
          curl --fail-with-body --silent --show-error -X POST 'https://node.windy.com/plugins/v1.0/upload' -H "x-windy-api-key: ${WINDY_API_KEY}" -F 'plugin_archive=@dist/plugin.tar' > dist/publish-response.json
          cat dist/publish-response.json
          echo 'Risposta Windy e URL di installazione:' >> "$GITHUB_STEP_SUMMARY"
          cat dist/publish-response.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: windy-plugin-regate
          path: |
            dist/plugin.tar
            dist/publish-response.json
